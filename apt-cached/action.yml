name: apt-cached
description: >-
  Install apt packages from a cache of their .deb files, keyed on the runner
  image and the package list. A hit installs offline with dpkg; only a miss
  goes to the apt mirrors, with a timeout on every call.

inputs:
  packages:
    description: Space- or newline-separated package names.
    required: true
  commands:
    description: >-
      Commands that must be on PATH afterwards (space-separated). Checked on
      every run; a missing one counts as a failed install.
    required: false
    default: ""
  required:
    description: >-
      "true": a failed install fails the step. "false": it becomes a warning
      and the step succeeds, for jobs whose tests skip without the tools.
    required: false
    default: "true"
  download-timeout:
    description: Seconds allowed for each download attempt on a cache miss.
    required: false
    default: "180"
  update-timeout:
    description: Seconds allowed for apt-get update on a cache miss.
    required: false
    default: "90"
outputs:
  cache-hit:
    description: '"true" when the packages came from the cache.'
    value: ${{ steps.restore.outputs.cache-hit == 'true' }}
  installed:
    description: '"true" when every package and command is in place.'
    value: ${{ steps.install.outputs.installed }}

runs:
  using: composite
  steps:
    - name: Cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        list=$(tr -s ' \n\t' '\n' <<< "$PACKAGES" | sed '/^$/d' | sort -u | tr '\n' ' ')
        hash=$(printf '%s' "$list" | sha256sum | cut -c1-16)
        {
          echo "key=apt-cached-${ImageOS:-unknown}-${ImageVersion:-unknown}-$(uname -m)-${hash}"
          echo "dir=${RUNNER_TEMP}/apt-cached-${hash}"
          echo "list=${list}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore .deb cache
      id: restore
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}

    - name: Install
      id: install
      shell: bash
      env:
        DEBS: ${{ steps.key.outputs.dir }}
        LIST: ${{ steps.key.outputs.list }}
        COMMANDS: ${{ inputs.commands }}
        REQUIRED: ${{ inputs.required }}
        DOWNLOAD_TIMEOUT: ${{ inputs.download-timeout }}
        UPDATE_TIMEOUT: ${{ inputs.update-timeout }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        set +e -uo pipefail   # exit codes are handled below
        read -ra pkgs <<< "$LIST"
        fail() {
          echo "installed=false" >> "$GITHUB_OUTPUT"
          rm -rf "$DEBS"   # never save an incomplete set
          if [ "$REQUIRED" = "true" ]; then
            echo "::error title=apt-cached::$1"
            exit 1
          fi
          echo "::warning title=apt-cached::$1"
          exit 0
        }
        mkdir -p "$DEBS/partial"
        if ! compgen -G "$DEBS/*.deb" >/dev/null; then
          opts=(-o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
                -o "Dir::Cache::archives=$DEBS")
          fetch() { timeout "$DOWNLOAD_TIMEOUT" sudo apt-get "${opts[@]}" install --download-only -y -q --no-install-recommends "${pkgs[@]}"; }
          update() { timeout "$UPDATE_TIMEOUT" sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q; }
          # A mirror whose name does not resolve makes apt retry until the
          # timeout (seen on 2026-11-11 for every *.ubuntu.com host, where a
          # lookup could also take minutes): check the names first, with a
          # bound per lookup, and fail in seconds instead.
          hosts=$( { cat /etc/apt/apt-mirrors.txt 2>/dev/null
                     grep -hsE '^(URIs:|deb )' /etc/apt/sources.list /etc/apt/sources.list.d/* ; } \
                   | grep -oE 'https?://[^/ ]+' | sed -E 's#https?://##' | sort -u)
          resolvable=""
          for h in $hosts; do
            if timeout 5 getent hosts "$h" >/dev/null; then resolvable="$resolvable $h"; echo "resolves: $h"
            else echo "does not resolve within 5 s: $h"; fi
          done
          if [ -n "$hosts" ] && [ -z "$resolvable" ]; then
            fail "no apt mirror resolves ($(echo $hosts)); DNS outage on the runner"
          fi
          # 1. The runner's package lists are usually fresh enough.
          fetch; rc=$?
          # 2. Stale lists fail fast: refresh them and try again. A timeout
          #    (124) means the mirror hangs, and an update would hang too.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::group::apt-get update"; update && fetch; rc=$?; echo "::endgroup::"
          fi
          [ "$rc" -eq 0 ] || fail "download of ${LIST} failed or timed out (exit $rc)"
          sudo rm -rf "$DEBS/partial" "$DEBS/lock"
          sudo chown -R "$USER" "$DEBS"
        fi
        if compgen -G "$DEBS/*.deb" >/dev/null; then
          sudo dpkg -i "$DEBS"/*.deb >/dev/null || fail "dpkg -i of the cached packages failed"
        fi
        for p in "${pkgs[@]}"; do
          dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "install ok installed" \
            || fail "package $p is not installed"
        done
        for c in $COMMANDS; do
          command -v "$c" >/dev/null || fail "command $c is not on PATH"
        done
        echo "installed=true" >> "$GITHUB_OUTPUT"

    - name: Save .deb cache
      if: steps.restore.outputs.cache-hit != 'true' && steps.install.outputs.installed == 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
