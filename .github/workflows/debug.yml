name: debug
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set -x
          cat /etc/apt/apt-mirrors.txt || true
          cat /etc/apt/sources.list.d/*.sources || true
          apt-config dump | grep -iE 'variant|architect' || true
          dpkg --print-architecture; dpkg --print-foreign-architectures || true
          apt-cache policy poppler-utils | head -20
      - name: azure amd64v3 pool
        run: curl -sS -m 20 -o /dev/null -w '%{http_code} %{time_total}\n' http://azure.archive.ubuntu.com/ubuntu/dists/resolute/main/binary-amd64v3/Release || true
      - name: archive amd64v3 pool
        run: curl -sS -m 20 -o /dev/null -w '%{http_code} %{time_total}\n' http://archive.ubuntu.com/ubuntu/dists/resolute/main/binary-amd64v3/Release || true
      - name: download via archive.ubuntu.com
        run: |
          sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#; s#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/*.sources
          timeout 120 sudo apt-get update -q | tail -3
          mkdir -p /tmp/d/partial; time timeout 120 sudo apt-get -o Dir::Cache::archives=/tmp/d install --download-only -y -q --no-install-recommends poppler-utils | tail -5
      - name: download with amd64 variant forced
        run: |
          mkdir -p /tmp/e/partial; time timeout 90 sudo apt-get -o APT::Architecture-Variants=amd64 -o Dir::Cache::archives=/tmp/e install --download-only -y -q --no-install-recommends ffmpeg | tail -5 || true
