name: debug
on: pull_request
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - run: |
          . /etc/os-release; echo "$PRETTY_NAME $ImageVersion"
          cat /etc/resolv.conf | grep -v '^#'
          for h in archive.ubuntu.com azure.archive.ubuntu.com security.ubuntu.com github.com deb.debian.org; do
            printf '%-28s getent=%s\n' "$h" "$(getent hosts $h | awk '{print $1}' | head -1)"
          done
          dig +short +time=3 archive.ubuntu.com @8.8.8.8 || true
          resolvectl status 2>/dev/null | grep -E 'DNS Server|Current' | head -4 || true
      - run: |
          mkdir -p /tmp/d/partial
          time timeout 120 sudo apt-get -o Dir::Cache::archives=/tmp/d install --download-only -y -q --no-install-recommends poppler-utils 2>&1 | grep -E 'Get:|Err|Ign|Fetched|E:' | head
